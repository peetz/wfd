add_meal:
  name: Add meal
  description: Add an active meal to WFD.
  fields:
    name:
      name: Name
      description: Meal name.
      required: true
      selector:
        text: {}

rename_meal:
  name: Rename meal
  description: Rename an existing meal.
  target: {}
  fields:
    meal_id:
      name: Meal ID
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}

archive_meal:
  name: Archive meal
  description: Archive a meal without deleting it.
  target: {}
  fields:
    meal_id:
      name: Meal ID
      required: true
      selector:
        text: {}

restore_meal:
  name: Restore meal
  description: Restore an archived meal.
  target: {}
  fields:
    meal_id:
      name: Meal ID
      required: true
      selector:
        text: {}

add_voter:
  name: Add voter
  description: Add a Home Assistant Person as a WFD voter.
  fields:
    person_id:
      name: Person
      required: true
      selector:
        entity:
          domain: person

archive_voter:
  name: Archive voter
  description: Archive a WFD voter.
  fields:
    person_id:
      name: Person
      required: true
      selector:
        entity:
          domain: person

restore_voter:
  name: Restore voter
  description: Restore an archived WFD voter.
  fields:
    person_id:
      name: Person
      required: true
      selector:
        entity:
          domain: person

start_voting:
  name: Start voting
  description: Start a new private household voting round.
  fields:
    meals_required:
      name: Meals required
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    deadline_minutes:
      name: Deadline in minutes
      required: false
      default: 1440
      selector:
        number:
          min: 1
          mode: box

submit_vote:
  name: Submit vote
  description: Submit an immutable private vote for a voting round.
  target: {}
  fields:
    round_id:
      name: Round ID
      required: true
      selector:
        text: {}
    meal_ids:
      name: Meal IDs
      required: true
      selector:
        object: {}

cancel_voting:
  name: Cancel voting
  description: Cancel an active voting round without generating results. Administrator only.
  target: {}
  fields:
    round_id:
      name: Round ID
      required: true
      selector:
        text: {}
